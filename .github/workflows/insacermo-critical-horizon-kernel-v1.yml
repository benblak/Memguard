name: INSACERMO Critical Horizon Kernel V1
on:
  push:
    branches: [insacermo-critical-horizon-kernel-v1]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Lean 4.32.1
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare mathlib
        working-directory: lean_ci
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          mkdir -p .lake/build/lib/lean
      - name: Build destruction admissibility dependency
        working-directory: lean_ci
        run: lake env lean -o .lake/build/lib/lean/DestructionAdmissibilityKernelV1.olean DestructionAdmissibilityKernelV1.lean
      - name: Build temporal destruction dependency
        working-directory: lean_ci
        run: lake env lean -o .lake/build/lib/lean/TemporalDestructionKernelV1.olean TemporalDestructionKernelV1.lean
      - name: Build temporal contract extension dependency
        working-directory: lean_ci
        run: lake env lean -o .lake/build/lib/lean/TemporalContractExtensionV1.olean TemporalContractExtensionV1.lean
      - name: Build temporal horizon dependency
        working-directory: lean_ci
        run: lake env lean -o .lake/build/lib/lean/TemporalHorizonKernelV1.olean TemporalHorizonKernelV1.lean
      - name: Build capability debt dependency
        working-directory: lean_ci
        run: lake env lean -o .lake/build/lib/lean/CapabilityDebtKernelV1.olean CapabilityDebtKernelV1.lean
      - name: Build joint horizon-capability dependency
        working-directory: lean_ci
        run: lake env lean -o .lake/build/lib/lean/JointHorizonCapabilityKernelV1.olean JointHorizonCapabilityKernelV1.lean
      - name: Kernel-check critical horizon kernel
        id: leancheck
        continue-on-error: true
        working-directory: lean_ci
        run: |
          set -o pipefail
          lake env lean -o .lake/build/lib/lean/CriticalHorizonKernelV1.olean CriticalHorizonKernelV1.lean 2>&1 | tee CRITICAL_HORIZON_KERNEL_V1_OUTPUT.txt
      - name: Persist diagnostics if Lean fails
        if: steps.leancheck.outcome == 'failure'
        run: |
          set -euo pipefail
          cp lean_ci/CRITICAL_HORIZON_KERNEL_V1_OUTPUT.txt lean_ci/CRITICAL_HORIZON_KERNEL_V1_DIAGNOSTIC.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lean_ci/CRITICAL_HORIZON_KERNEL_V1_DIAGNOSTIC.txt
          git commit -m 'Capture critical horizon diagnostics [skip ci]' || true
          git push
          exit 1
      - name: Bundled leanchecker independent replay
        working-directory: lean_ci
        run: |
          set -euo pipefail
          lake env leanchecker -v CriticalHorizonKernelV1 | tee CRITICAL_HORIZON_KERNEL_V1_LEANCHECKER.txt
      - name: Verify no placeholders or custom axioms
        working-directory: lean_ci
        run: |
          if grep -nE '\b(sorry|admit)\b' CriticalHorizonKernelV1.lean; then exit 1; fi
          if grep -nE '^\s*axiom\b' CriticalHorizonKernelV1.lean; then exit 1; fi
          echo 'No sorry/admit/custom axiom placeholders found.'
      - name: Build certification receipt
        working-directory: lean_ci
        run: |
          printf '%s\n' \
            'INSACERMO CRITICAL HORIZON KERNEL V1 — CERTIFICATION' \
            '' \
            "Run: ${GITHUB_RUN_ID}" \
            "Commit: ${GITHUB_SHA}" \
            'Lean: 4.32.1' \
            'mathlib: v4.32.1' \
            'Targets: source persistence; admissibility initial-segment law; persistent revocation; Nat.find critical horizon; exact threshold theorem; localized cause at first expiry; nonpersistent admit-revoke-admit counterexample; certified tau=1 witness.' \
            > CRITICAL_HORIZON_KERNEL_V1_CERTIFICATE.txt
          cp .lake/build/lib/lean/CriticalHorizonKernelV1.olean ./CriticalHorizonKernelV1.olean
          sha256sum CriticalHorizonKernelV1.lean CriticalHorizonKernelV1.olean CRITICAL_HORIZON_KERNEL_V1_OUTPUT.txt CRITICAL_HORIZON_KERNEL_V1_LEANCHECKER.txt CRITICAL_HORIZON_KERNEL_V1_CERTIFICATE.txt > CRITICAL_HORIZON_KERNEL_V1_SHA256SUMS.txt
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: INSACERMO_CRITICAL_HORIZON_KERNEL_V1
          path: |
            lean_ci/CriticalHorizonKernelV1.lean
            lean_ci/CriticalHorizonKernelV1.olean
            lean_ci/CRITICAL_HORIZON_KERNEL_V1_OUTPUT.txt
            lean_ci/CRITICAL_HORIZON_KERNEL_V1_LEANCHECKER.txt
            lean_ci/CRITICAL_HORIZON_KERNEL_V1_CERTIFICATE.txt
            lean_ci/CRITICAL_HORIZON_KERNEL_V1_SHA256SUMS.txt
          if-no-files-found: error
