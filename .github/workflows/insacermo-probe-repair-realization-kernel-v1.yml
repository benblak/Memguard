name: INSACERMO Probe-Repair Realization Kernel V1
on:
  push:
    branches: [insacermo-probe-repair-realization-kernel-v1]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Lean 4.32.1
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare mathlib
        working-directory: lean_ci
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          mkdir -p .lake/build/lib/lean
      - name: Build quotient dependency
        working-directory: lean_ci
        run: |
          set -euo pipefail
          lake env lean -o .lake/build/lib/lean/ProbeRepairAlternationKernelV1.olean ProbeRepairAlternationKernelV1.lean
      - name: Kernel-check realization formalization
        id: leancheck
        continue-on-error: true
        working-directory: lean_ci
        run: |
          set -o pipefail
          lake env lean -o .lake/build/lib/lean/ProbeRepairRealizationKernelV1.olean ProbeRepairRealizationKernelV1.lean 2>&1 | tee PROBE_REPAIR_REALIZATION_KERNEL_V1_OUTPUT.txt
      - name: Persist diagnostics if Lean fails
        if: steps.leancheck.outcome == 'failure'
        run: |
          set -euo pipefail
          cp lean_ci/PROBE_REPAIR_REALIZATION_KERNEL_V1_OUTPUT.txt lean_ci/PROBE_REPAIR_REALIZATION_KERNEL_V1_DIAGNOSTIC.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lean_ci/PROBE_REPAIR_REALIZATION_KERNEL_V1_DIAGNOSTIC.txt
          git commit -m 'Capture Lean probe-repair realization diagnostics [skip ci]' || true
          git push
          exit 1
      - name: Bundled leanchecker independent replay
        working-directory: lean_ci
        run: |
          set -euo pipefail
          lake env leanchecker -v ProbeRepairRealizationKernelV1 | tee PROBE_REPAIR_REALIZATION_KERNEL_V1_LEANCHECKER.txt
      - name: Verify no placeholders or custom axioms
        working-directory: lean_ci
        run: |
          if grep -nE '\b(sorry|admit)\b' ProbeRepairRealizationKernelV1.lean; then exit 1; fi
          if grep -nE '^\s*axiom\b' ProbeRepairRealizationKernelV1.lean; then exit 1; fi
          echo 'No sorry/admit/custom axiom placeholders found.'
      - name: Build certification receipt
        working-directory: lean_ci
        run: |
          printf '%s\n' \
            'INSACERMO PROBE-REPAIR REALIZATION KERNEL V1 — CERTIFICATION' \
            '' \
            "Run: ${GITHUB_RUN_ID}" \
            "Commit: ${GITHUB_SHA}" \
            'Lean: 4.32.1' \
            'mathlib revision: 520045ab14e26149ee970e2e617ca04b09bde5d6' \
            'Certification: Lean elaboration/kernel check + bundled leanchecker declaration replay.' \
            'Scope: finite explicit two-world actionability gadget realizes unresolved/informed quotient states; combined with the verified alternation quotient gives concrete staged realizability. It is not yet a full hidden-vector minimax optimal-policy theorem.' \
            > PROBE_REPAIR_REALIZATION_KERNEL_V1_CERTIFICATE.txt
          cp .lake/build/lib/lean/ProbeRepairRealizationKernelV1.olean ./ProbeRepairRealizationKernelV1.olean
          sha256sum ProbeRepairRealizationKernelV1.lean ProbeRepairRealizationKernelV1.olean PROBE_REPAIR_REALIZATION_KERNEL_V1_OUTPUT.txt PROBE_REPAIR_REALIZATION_KERNEL_V1_LEANCHECKER.txt PROBE_REPAIR_REALIZATION_KERNEL_V1_CERTIFICATE.txt > PROBE_REPAIR_REALIZATION_KERNEL_V1_SHA256SUMS.txt
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: INSACERMO_PROBE_REPAIR_REALIZATION_KERNEL_V1
          path: |
            lean_ci/ProbeRepairRealizationKernelV1.lean
            lean_ci/ProbeRepairRealizationKernelV1.olean
            lean_ci/PROBE_REPAIR_REALIZATION_KERNEL_V1_OUTPUT.txt
            lean_ci/PROBE_REPAIR_REALIZATION_KERNEL_V1_LEANCHECKER.txt
            lean_ci/PROBE_REPAIR_REALIZATION_KERNEL_V1_CERTIFICATE.txt
            lean_ci/PROBE_REPAIR_REALIZATION_KERNEL_V1_SHA256SUMS.txt
          if-no-files-found: error
