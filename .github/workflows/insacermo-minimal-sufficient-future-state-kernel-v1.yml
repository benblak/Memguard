name: INSACERMO Minimal Sufficient Future State Kernel V1

on:
  push:
    branches:
      - insacermo-minimal-sufficient-future-state-kernel-v1

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Lean 4.32.1
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Prepare mathlib
        working-directory: lean_ci
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          mkdir -p .lake/build/lib/lean

      - name: Kernel-check minimal sufficient future state kernel
        id: kernel
        continue-on-error: true
        working-directory: lean_ci
        run: |
          set -o pipefail
          lake env lean -o .lake/build/lib/lean/MinimalSufficientFutureStateKernelV1.olean MinimalSufficientFutureStateKernelV1.lean 2>&1 | tee MINIMAL_SUFFICIENT_FUTURE_STATE_KERNEL_V1_OUTPUT.txt

      - name: Persist diagnostics if Lean fails
        if: steps.kernel.outcome == 'failure'
        run: |
          set -euo pipefail
          cp lean_ci/MINIMAL_SUFFICIENT_FUTURE_STATE_KERNEL_V1_OUTPUT.txt lean_ci/MINIMAL_SUFFICIENT_FUTURE_STATE_KERNEL_V1_DIAGNOSTIC.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lean_ci/MINIMAL_SUFFICIENT_FUTURE_STATE_KERNEL_V1_DIAGNOSTIC.txt
          git commit -m 'Capture minimal sufficient future state diagnostics [skip ci]' || true
          git push
          exit 1

      - name: Bundled leanchecker independent replay
        if: steps.kernel.outcome == 'success'
        working-directory: lean_ci
        run: |
          set -euo pipefail
          lake env leanchecker -v MinimalSufficientFutureStateKernelV1 | tee MINIMAL_SUFFICIENT_FUTURE_STATE_KERNEL_V1_LEANCHECKER.txt

      - name: Verify no placeholders or custom axioms
        if: steps.kernel.outcome == 'success'
        working-directory: lean_ci
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('MinimalSufficientFutureStateKernelV1.lean')
          s = p.read_text()
          out=[]; i=0; depth=0
          while i < len(s):
              if s.startswith('/-', i): depth += 1; i += 2; continue
              if depth and s.startswith('-/', i): depth -= 1; i += 2; continue
              if depth:
                  out.append('\n' if s[i]=='\n' else ' '); i += 1; continue
              if s.startswith('--', i):
                  j=s.find('\n', i)
                  if j<0: break
                  out.append('\n'); i=j+1; continue
              out.append(s[i]); i += 1
          code=''.join(out)
          bad=[]
          for n,line in enumerate(code.splitlines(),1):
              if re.search(r'\b(?:sorry|admit)\b', line): bad.append((n,line))
              if re.search(r'^\s*axiom\b', line): bad.append((n,line))
          if bad:
              for n,line in bad: print(f'{n}:{line}')
              raise SystemExit(1)
          print('No sorry/admit/custom axiom placeholders found in executable Lean code.')
          PY

      - name: Build certification receipt
        if: steps.kernel.outcome == 'success'
        working-directory: lean_ci
        run: |
          set -euo pipefail
          printf '%s\n' \
            'INSACERMO MINIMAL SUFFICIENT FUTURE STATE KERNEL V1 — CERTIFICATION' \
            '' \
            "Run: ${GITHUB_RUN_ID}" \
            "Commit: ${GITHUB_SHA}" \
            'Lean: 4.32.1' \
            'mathlib: v4.32.1' \
            'Kernel check: success' \
            'Leanchecker independent replay: success' \
            'Placeholders/custom axioms: none' \
            > MINIMAL_SUFFICIENT_FUTURE_STATE_KERNEL_V1_CERTIFICATE.txt
          cp .lake/build/lib/lean/MinimalSufficientFutureStateKernelV1.olean ./MinimalSufficientFutureStateKernelV1.olean
          sha256sum MinimalSufficientFutureStateKernelV1.lean MinimalSufficientFutureStateKernelV1.olean MINIMAL_SUFFICIENT_FUTURE_STATE_KERNEL_V1_OUTPUT.txt MINIMAL_SUFFICIENT_FUTURE_STATE_KERNEL_V1_LEANCHECKER.txt MINIMAL_SUFFICIENT_FUTURE_STATE_KERNEL_V1_CERTIFICATE.txt > MINIMAL_SUFFICIENT_FUTURE_STATE_KERNEL_V1_SHA256SUMS.txt

      - name: Upload evidence
        if: steps.kernel.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: INSACERMO_MINIMAL_SUFFICIENT_FUTURE_STATE_KERNEL_V1
          path: |
            lean_ci/MinimalSufficientFutureStateKernelV1.lean
            lean_ci/MinimalSufficientFutureStateKernelV1.olean
            lean_ci/MINIMAL_SUFFICIENT_FUTURE_STATE_KERNEL_V1_OUTPUT.txt
            lean_ci/MINIMAL_SUFFICIENT_FUTURE_STATE_KERNEL_V1_LEANCHECKER.txt
            lean_ci/MINIMAL_SUFFICIENT_FUTURE_STATE_KERNEL_V1_CERTIFICATE.txt
            lean_ci/MINIMAL_SUFFICIENT_FUTURE_STATE_KERNEL_V1_SHA256SUMS.txt
          if-no-files-found: error
