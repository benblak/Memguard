name: INSACERMO Probe-Repair Alternation Kernel V1
on:
  push:
    branches: [insacermo-probe-repair-alternation-kernel-v1]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Lean 4.32.1
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare mathlib
        working-directory: lean_ci
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          mkdir -p .lake/build/lib/lean
      - name: Kernel-check alternation formalization
        id: leancheck
        continue-on-error: true
        working-directory: lean_ci
        run: |
          set -o pipefail
          lake env lean -o .lake/build/lib/lean/ProbeRepairAlternationKernelV1.olean ProbeRepairAlternationKernelV1.lean 2>&1 | tee PROBE_REPAIR_ALTERNATION_KERNEL_V1_OUTPUT.txt
      - name: Persist diagnostics if Lean fails
        if: steps.leancheck.outcome == 'failure'
        run: |
          set -euo pipefail
          cp lean_ci/PROBE_REPAIR_ALTERNATION_KERNEL_V1_OUTPUT.txt lean_ci/PROBE_REPAIR_ALTERNATION_KERNEL_V1_DIAGNOSTIC.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lean_ci/PROBE_REPAIR_ALTERNATION_KERNEL_V1_DIAGNOSTIC.txt
          git commit -m 'Capture Lean probe-repair alternation diagnostics [skip ci]' || true
          git push
          exit 1
      - name: Bundled leanchecker independent replay
        working-directory: lean_ci
        run: |
          set -euo pipefail
          lake env leanchecker -v ProbeRepairAlternationKernelV1 | tee PROBE_REPAIR_ALTERNATION_KERNEL_V1_LEANCHECKER.txt
      - name: Verify no placeholders or custom axioms
        working-directory: lean_ci
        run: |
          if grep -nE '\b(sorry|admit)\b' ProbeRepairAlternationKernelV1.lean; then exit 1; fi
          if grep -nE '^\s*axiom\b' ProbeRepairAlternationKernelV1.lean; then exit 1; fi
          echo 'No sorry/admit/custom axiom placeholders found.'
      - name: Build certification receipt
        working-directory: lean_ci
        run: |
          printf '%s\n' \
            'INSACERMO PROBE-REPAIR ALTERNATION KERNEL V1 — CERTIFICATION' \
            '' \
            "Run: ${GITHUB_RUN_ID}" \
            "Commit: ${GITHUB_SHA}" \
            'Lean: 4.32.1' \
            'mathlib: v4.32.1' \
            'Certification: Lean elaboration/kernel check + bundled leanchecker declaration replay.' \
            'Targets: T5a one-stage non-commutation; T5b canonical PR alternation wins; T5c winning role trace uniqueness; T5d exact 2k winning length and alternation; T5e PRP forced from two stages; T5f unbounded forced alternation family.' \
            'Scope note: this kernel formalizes the finite deterministic staged role-level quotient. It does not claim that all sequential diagnosis/control problems require alternation.' \
            > PROBE_REPAIR_ALTERNATION_KERNEL_V1_CERTIFICATE.txt
          cp .lake/build/lib/lean/ProbeRepairAlternationKernelV1.olean ./ProbeRepairAlternationKernelV1.olean
          sha256sum ProbeRepairAlternationKernelV1.lean ProbeRepairAlternationKernelV1.olean PROBE_REPAIR_ALTERNATION_KERNEL_V1_OUTPUT.txt PROBE_REPAIR_ALTERNATION_KERNEL_V1_LEANCHECKER.txt PROBE_REPAIR_ALTERNATION_KERNEL_V1_CERTIFICATE.txt > PROBE_REPAIR_ALTERNATION_KERNEL_V1_SHA256SUMS.txt
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: INSACERMO_PROBE_REPAIR_ALTERNATION_KERNEL_V1
          path: |
            lean_ci/ProbeRepairAlternationKernelV1.lean
            lean_ci/ProbeRepairAlternationKernelV1.olean
            lean_ci/PROBE_REPAIR_ALTERNATION_KERNEL_V1_OUTPUT.txt
            lean_ci/PROBE_REPAIR_ALTERNATION_KERNEL_V1_LEANCHECKER.txt
            lean_ci/PROBE_REPAIR_ALTERNATION_KERNEL_V1_CERTIFICATE.txt
            lean_ci/PROBE_REPAIR_ALTERNATION_KERNEL_V1_SHA256SUMS.txt
          if-no-files-found: error
