name: INSACERMO Robust Right-to-Forget Kernel V1
on:
  push:
    branches: [insacermo-robust-right-to-forget-kernel-v1]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Lean 4.32.1
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare mathlib
        working-directory: lean_ci
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          mkdir -p .lake/build/lib/lean
      - name: Build destruction admissibility dependency
        working-directory: lean_ci
        run: lake env lean -o .lake/build/lib/lean/DestructionAdmissibilityKernelV1.olean DestructionAdmissibilityKernelV1.lean
      - name: Build temporal destruction dependency
        working-directory: lean_ci
        run: lake env lean -o .lake/build/lib/lean/TemporalDestructionKernelV1.olean TemporalDestructionKernelV1.lean
      - name: Build temporal contract extension dependency
        working-directory: lean_ci
        run: lake env lean -o .lake/build/lib/lean/TemporalContractExtensionV1.olean TemporalContractExtensionV1.lean
      - name: Build temporal horizon dependency
        working-directory: lean_ci
        run: lake env lean -o .lake/build/lib/lean/TemporalHorizonKernelV1.olean TemporalHorizonKernelV1.lean
      - name: Build capability debt dependency
        working-directory: lean_ci
        run: lake env lean -o .lake/build/lib/lean/CapabilityDebtKernelV1.olean CapabilityDebtKernelV1.lean
      - name: Build joint horizon-capability dependency
        working-directory: lean_ci
        run: lake env lean -o .lake/build/lib/lean/JointHorizonCapabilityKernelV1.olean JointHorizonCapabilityKernelV1.lean
      - name: Build critical horizon dependency
        working-directory: lean_ci
        run: lake env lean -o .lake/build/lib/lean/CriticalHorizonKernelV1.olean CriticalHorizonKernelV1.lean
      - name: Kernel-check robust right-to-forget kernel
        id: leancheck
        continue-on-error: true
        working-directory: lean_ci
        run: |
          set -o pipefail
          lake env lean -o .lake/build/lib/lean/RobustRightToForgetKernelV1.olean RobustRightToForgetKernelV1.lean 2>&1 | tee ROBUST_RIGHT_TO_FORGET_KERNEL_V1_OUTPUT.txt
      - name: Persist diagnostics if Lean fails
        if: steps.leancheck.outcome == 'failure'
        run: |
          set -euo pipefail
          cp lean_ci/ROBUST_RIGHT_TO_FORGET_KERNEL_V1_OUTPUT.txt lean_ci/ROBUST_RIGHT_TO_FORGET_KERNEL_V1_DIAGNOSTIC.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lean_ci/ROBUST_RIGHT_TO_FORGET_KERNEL_V1_DIAGNOSTIC.txt
          git commit -m 'Capture robust right-to-forget diagnostics [skip ci]' || true
          git push
          exit 1
      - name: Bundled leanchecker independent replay
        working-directory: lean_ci
        run: |
          set -euo pipefail
          lake env leanchecker -v RobustRightToForgetKernelV1 | tee ROBUST_RIGHT_TO_FORGET_KERNEL_V1_LEANCHECKER.txt
      - name: Verify no placeholders or custom axioms
        working-directory: lean_ci
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          src = Path('RobustRightToForgetKernelV1.lean').read_text()
          out=[]; i=0; depth=0
          while i < len(src):
              if depth == 0 and src.startswith('--', i):
                  j = src.find('\n', i)
                  if j == -1: break
                  out.append('\n'); i = j + 1
              elif src.startswith('/-', i):
                  depth += 1; i += 2
              elif depth > 0 and src.startswith('-/', i):
                  depth -= 1; i += 2
              elif depth == 0:
                  out.append(src[i]); i += 1
              else:
                  if src[i] == '\n': out.append('\n')
                  i += 1
          code=''.join(out)
          bad=[]
          for lineno,line in enumerate(code.splitlines(),1):
              if re.search(r'\b(?:sorry|admit)\b', line): bad.append((lineno,line))
              if re.search(r'^\s*axiom\b', line): bad.append((lineno,line))
          if bad:
              for lineno,line in bad: print(f'{lineno}:{line}')
              raise SystemExit(1)
          print('No sorry/admit/custom axiom placeholders found in executable Lean code.')
          PY
      - name: Build certification receipt
        working-directory: lean_ci
        run: |
          printf '%s\n' \
            'INSACERMO ROBUST RIGHT-TO-FORGET KERNEL V1 — CERTIFICATION' \
            '' \
            "Run: ${GITHUB_RUN_ID}" \
            "Commit: ${GITHUB_SHA}" \
            'Lean: 4.32.1' \
            'mathlib: v4.32.1' \
            'Targets: capability uncertainty envelopes; absolute source/target viability; relative-vs-strong robust safety equivalence under source viability; antitone robust safety; persistent robust revocation; robust critical horizon; exact threshold law; anti-vacuity witness; uncertainty-expansion revocation witness.' \
            > ROBUST_RIGHT_TO_FORGET_KERNEL_V1_CERTIFICATE.txt
          cp .lake/build/lib/lean/RobustRightToForgetKernelV1.olean ./RobustRightToForgetKernelV1.olean
          sha256sum RobustRightToForgetKernelV1.lean RobustRightToForgetKernelV1.olean ROBUST_RIGHT_TO_FORGET_KERNEL_V1_OUTPUT.txt ROBUST_RIGHT_TO_FORGET_KERNEL_V1_LEANCHECKER.txt ROBUST_RIGHT_TO_FORGET_KERNEL_V1_CERTIFICATE.txt > ROBUST_RIGHT_TO_FORGET_KERNEL_V1_SHA256SUMS.txt
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: INSACERMO_ROBUST_RIGHT_TO_FORGET_KERNEL_V1
          path: |
            lean_ci/RobustRightToForgetKernelV1.lean
            lean_ci/RobustRightToForgetKernelV1.olean
            lean_ci/ROBUST_RIGHT_TO_FORGET_KERNEL_V1_OUTPUT.txt
            lean_ci/ROBUST_RIGHT_TO_FORGET_KERNEL_V1_LEANCHECKER.txt
            lean_ci/ROBUST_RIGHT_TO_FORGET_KERNEL_V1_CERTIFICATE.txt
            lean_ci/ROBUST_RIGHT_TO_FORGET_KERNEL_V1_SHA256SUMS.txt
          if-no-files-found: error
