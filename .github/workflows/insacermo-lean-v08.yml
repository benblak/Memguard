name: INSACERMO V0.11 WDBC PROBE bridge
on:
  push:
    branches: [insacermo-core-v08-build-test]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Materialize certified V0.11 engine plus WDBC bridge
        run: |
          set -euo pipefail
          cd lean_ci
          gzip -dc InsacermoFlatV09.lean.gz > full.lean
          awk '/-- ===== Compiler.lean =====/{exit} {print}' full.lean > InsacermoFlat.lean
          python3 apply_mathcore_v010.py
          mv InsacermoFlat.lean mathcore_v010.lean
          cat mathcore_v010.lean > InsacermoV011StageB.lean
          awk 'BEGIN{p=0} /-- ===== Compiler.lean =====/{p=1} /-- ===== ExecutableCompiler.lean =====/{exit} p{print}' full.lean >> InsacermoV011StageB.lean
          cp InsacermoV011StageB.lean InsacermoV011StageA.lean
          python3 apply_v011_stagea.py
          mv InsacermoV011StageA.lean semantic_stagea_verified.lean
          cat semantic_stagea_verified.lean > InsacermoV011StageB.lean
          awk 'BEGIN{p=0} /-- ===== ExecutableCompiler.lean =====/{p=1} /-- ===== OperationalSemantics.lean =====/{exit} p{print}' full.lean >> InsacermoV011StageB.lean
          python3 apply_v011_stageb.py
          cat InsacermoV011StageB.lean > InsacermoV011StageC.lean
          awk 'BEGIN{p=0} /-- ===== OperationalSemantics.lean =====/{p=1} /-- ===== ExecutableSoundness.lean =====/{exit} p{print}' full.lean >> InsacermoV011StageC.lean
          python3 apply_v011_stagec.py
          cat InsacermoV011StageC.lean > InsacermoV011StageD.lean
          awk 'BEGIN{p=0} /-- ===== ExecutableSoundness.lean =====/{p=1} p{print}' full.lean >> InsacermoV011StageD.lean
          python3 apply_v011_staged.py
          python3 apply_v011_staged_terminal_fix.py
          cp InsacermoV011StageD.lean INSACERMO_CORE_ENGINE_V011.lean
          python3 generate_v011_wdbc_probe.py
          cat INSACERMO_CORE_ENGINE_V011.lean v011_wdbc_probe_bridge.lean > INSACERMO_CORE_ENGINE_V011_WDBC_PROBE.lean
          wc -l INSACERMO_CORE_ENGINE_V011_WDBC_PROBE.lean
      - name: Install Lean 4.32.1
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Execute and kernel-check WDBC PROBE bridge
        working-directory: lean_ci
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          lake env lean INSACERMO_CORE_ENGINE_V011_WDBC_PROBE.lean | tee V011_WDBC_PROBE_OUTPUT.txt
      - name: Verify WDBC suite has no placeholders
        working-directory: lean_ci
        run: |
          if grep -nE '\b(sorry|admit)\b' INSACERMO_CORE_ENGINE_V011_WDBC_PROBE.lean; then exit 1; fi
          echo 'No sorry/admit placeholders found.'
      - name: Build WDBC evidence note
        working-directory: lean_ci
        run: |
          printf '%s\n' \
            'INSACERMO V0.11 — WDBC PROBE BRIDGE' \
            '' \
            "Run: ${GITHUB_RUN_ID}" \
            "Commit: ${GITHUB_SHA}" \
            'Source: official UCI WDBC archive downloaded during CI.' \
            'Rows: 569; malignant=212; benign=357.' \
            'Probe contract: six selected features discretized by quartiles.' \
            'Expected structural result: six-measure signature gives 462 observed class-pure fibers.' \
            'Drop-one unresolved opposite-class pairs: 15,16,9,6,8,16.' \
            'Expected V0.11 decisions: REFUSE without probe; PROBE candidate index 6 with full six-measure signature.' \
            '' \
            'Boundary: benchmark structural validation only, not clinical diagnosis or medical-device validation.' \
            > WDBC_PROBE_CERTIFICATE.txt
          sha256sum generate_v011_wdbc_probe.py v011_wdbc_probe_bridge.lean WDBC_PROBE_569_BINNED.csv INSACERMO_CORE_ENGINE_V011_WDBC_PROBE.lean V011_WDBC_PROBE_OUTPUT.txt WDBC_GENERATOR_RECEIPT.txt WDBC_PROBE_CERTIFICATE.txt > WDBC_PROBE_SHA256SUMS.txt
      - name: Upload WDBC evidence
        uses: actions/upload-artifact@v4
        with:
          name: INSACERMO_V011_WDBC_PROBE_BRIDGE
          path: |
            lean_ci/V011_WDBC_PROBE_OUTPUT.txt
            lean_ci/v011_wdbc_probe_bridge.lean
            lean_ci/generate_v011_wdbc_probe.py
            lean_ci/WDBC_PROBE_569_BINNED.csv
            lean_ci/WDBC_GENERATOR_RECEIPT.txt
            lean_ci/WDBC_PROBE_CERTIFICATE.txt
            lean_ci/WDBC_PROBE_SHA256SUMS.txt
          if-no-files-found: error
