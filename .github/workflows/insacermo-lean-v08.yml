name: INSACERMO V0.11 unbounded capability leverage
on:
  push:
    branches: [insacermo-core-v08-build-test]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Materialize certified V0.11 engine plus unbounded leverage theorem
        run: |
          set -euo pipefail
          cd lean_ci
          gzip -dc InsacermoFlatV09.lean.gz > full.lean
          awk '/-- ===== Compiler.lean =====/{exit} {print}' full.lean > InsacermoFlat.lean
          python3 apply_mathcore_v010.py
          mv InsacermoFlat.lean mathcore_v010.lean
          cat mathcore_v010.lean > InsacermoV011StageB.lean
          awk 'BEGIN{p=0} /-- ===== Compiler.lean =====/{p=1} /-- ===== ExecutableCompiler.lean =====/{exit} p{print}' full.lean >> InsacermoV011StageB.lean
          cp InsacermoV011StageB.lean InsacermoV011StageA.lean
          python3 apply_v011_stagea.py
          mv InsacermoV011StageA.lean semantic_stagea_verified.lean
          cat semantic_stagea_verified.lean > InsacermoV011StageB.lean
          awk 'BEGIN{p=0} /-- ===== ExecutableCompiler.lean =====/{p=1} /-- ===== OperationalSemantics.lean =====/{exit} p{print}' full.lean >> InsacermoV011StageB.lean
          python3 apply_v011_stageb.py
          cat InsacermoV011StageB.lean > InsacermoV011StageC.lean
          awk 'BEGIN{p=0} /-- ===== OperationalSemantics.lean =====/{p=1} /-- ===== ExecutableSoundness.lean =====/{exit} p{print}' full.lean >> InsacermoV011StageC.lean
          python3 apply_v011_stagec.py
          cat InsacermoV011StageC.lean > InsacermoV011StageD.lean
          awk 'BEGIN{p=0} /-- ===== ExecutableSoundness.lean =====/{p=1} p{print}' full.lean >> InsacermoV011StageD.lean
          python3 apply_v011_staged.py
          python3 apply_v011_staged_terminal_fix.py
          cat InsacermoV011StageD.lean v011_unbounded_capability_leverage.lean > INSACERMO_V011_UNBOUNDED_CAPABILITY_LEVERAGE.lean
          wc -l INSACERMO_V011_UNBOUNDED_CAPABILITY_LEVERAGE.lean
      - name: Install Lean 4.32.1
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check unbounded capability leverage theorem
        working-directory: lean_ci
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          lake env lean INSACERMO_V011_UNBOUNDED_CAPABILITY_LEVERAGE.lean | tee V011_UNBOUNDED_CAPABILITY_LEVERAGE_OUTPUT.txt
      - name: Verify no placeholders
        working-directory: lean_ci
        run: |
          if grep -nE '\b(sorry|admit)\b' INSACERMO_V011_UNBOUNDED_CAPABILITY_LEVERAGE.lean; then exit 1; fi
          echo 'No sorry/admit placeholders found.'
      - name: Build evidence note
        working-directory: lean_ci
        run: |
          printf '%s\n' \
            'INSACERMO V0.11 — UNBOUNDED CAPABILITY LEVERAGE FAMILY' \
            '' \
            "Run: ${GITHUB_RUN_ID}" \
            "Commit: ${GITHUB_SHA}" \
            'Parametric theorem: for every n >= 3, every base-safe representation is injective on n states.' \
            'After adding one non-universal bulk action, a two-code exceptional/non-exceptional representation is safe.' \
            'The same two-code representation is unsafe before capability expansion.' \
            'Interpretation: one added capability can induce arbitrarily large cardinality compression of safe representations.' \
            'Bit corollary: taking n = 2^(m+1) yields a reduction from at least m+1 distinguishable bits to 1 bit.' \
            'Boundary: historical novelty is not proved by Lean.' \
            > UNBOUNDED_CAPABILITY_LEVERAGE_CERTIFICATE.txt
          sha256sum v011_unbounded_capability_leverage.lean INSACERMO_V011_UNBOUNDED_CAPABILITY_LEVERAGE.lean V011_UNBOUNDED_CAPABILITY_LEVERAGE_OUTPUT.txt UNBOUNDED_CAPABILITY_LEVERAGE_CERTIFICATE.txt > UNBOUNDED_CAPABILITY_LEVERAGE_SHA256SUMS.txt
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: INSACERMO_V011_UNBOUNDED_CAPABILITY_LEVERAGE
          path: |
            lean_ci/V011_UNBOUNDED_CAPABILITY_LEVERAGE_OUTPUT.txt
            lean_ci/v011_unbounded_capability_leverage.lean
            lean_ci/UNBOUNDED_CAPABILITY_LEVERAGE_CERTIFICATE.txt
            lean_ci/UNBOUNDED_CAPABILITY_LEVERAGE_SHA256SUMS.txt
          if-no-files-found: error
