name: INSACERMO Lean V0.9 build test
on:
  push:
    branches: [insacermo-core-v08-build-test]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Materialize flattened Lean source V0.9
        run: |
          cd lean_ci
          gzip -dc InsacermoFlatV09.lean.gz > InsacermoFlat.lean
      - name: Install Lean 4.32.1
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve mathlib and compile INSACERMO V0.9
        working-directory: lean_ci
        run: |
          lake update
          lake exe cache get
          lake env lean InsacermoFlat.lean
