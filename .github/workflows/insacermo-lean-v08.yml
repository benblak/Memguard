name: INSACERMO V0.11 ModeChoice full-210 bridge
on:
  push:
    branches: [insacermo-core-v08-build-test]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Materialize certified V0.11 engine plus full-210 bridge
        run: |
          set -euo pipefail
          cd lean_ci
          gzip -dc InsacermoFlatV09.lean.gz > full.lean
          awk '/-- ===== Compiler.lean =====/{exit} {print}' full.lean > InsacermoFlat.lean
          python3 apply_mathcore_v010.py
          mv InsacermoFlat.lean mathcore_v010.lean
          cat mathcore_v010.lean > InsacermoV011StageB.lean
          awk 'BEGIN{p=0} /-- ===== Compiler.lean =====/{p=1} /-- ===== ExecutableCompiler.lean =====/{exit} p{print}' full.lean >> InsacermoV011StageB.lean
          cp InsacermoV011StageB.lean InsacermoV011StageA.lean
          python3 apply_v011_stagea.py
          mv InsacermoV011StageA.lean semantic_stagea_verified.lean
          cat semantic_stagea_verified.lean > InsacermoV011StageB.lean
          awk 'BEGIN{p=0} /-- ===== ExecutableCompiler.lean =====/{p=1} /-- ===== OperationalSemantics.lean =====/{exit} p{print}' full.lean >> InsacermoV011StageB.lean
          python3 apply_v011_stageb.py
          cat InsacermoV011StageB.lean > InsacermoV011StageC.lean
          awk 'BEGIN{p=0} /-- ===== OperationalSemantics.lean =====/{p=1} /-- ===== ExecutableSoundness.lean =====/{exit} p{print}' full.lean >> InsacermoV011StageC.lean
          python3 apply_v011_stagec.py
          cat InsacermoV011StageC.lean > InsacermoV011StageD.lean
          awk 'BEGIN{p=0} /-- ===== ExecutableSoundness.lean =====/{p=1} p{print}' full.lean >> InsacermoV011StageD.lean
          python3 apply_v011_staged.py
          python3 apply_v011_staged_terminal_fix.py
          cp InsacermoV011StageD.lean INSACERMO_CORE_ENGINE_V011.lean
          python3 generate_v011_modechoice_full210_v2.py
          cat INSACERMO_CORE_ENGINE_V011.lean v011_modechoice_full210_bridge.lean > INSACERMO_CORE_ENGINE_V011_MODECHOICE_FULL210.lean
          wc -l INSACERMO_CORE_ENGINE_V011_MODECHOICE_FULL210.lean
      - name: Install Lean 4.32.1
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Execute and kernel-check full-210 bridge
        working-directory: lean_ci
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          lake env lean INSACERMO_CORE_ENGINE_V011_MODECHOICE_FULL210.lean | tee V011_MODECHOICE_FULL210_OUTPUT.txt
      - name: Verify full-210 suite has no placeholders
        working-directory: lean_ci
        run: |
          if grep -nE '\b(sorry|admit)\b' INSACERMO_CORE_ENGINE_V011_MODECHOICE_FULL210.lean; then exit 1; fi
          echo 'No sorry/admit placeholders found.'
      - name: Build full-210 evidence note
        working-directory: lean_ci
        run: |
          printf '%s\n' \
            'INSACERMO V0.11 — MODECHOICE FULL-210 BRIDGE' \
            '' \
            "Run: ${GITHUB_RUN_ID}" \
            "Commit: ${GITHUB_SHA}" \
            'Raw statsmodels modechoice.csv SHA256: d2d72c1db440f8ffce01f58ed39fc1145569ec1703970dac1636c154fc01fd8e' \
            'Rows: 840' \
            'Individuals: 210' \
            'Contract: Pareto-undominated in (gc, ttme+invt), both minimized.' \
            'Raw mechanical profile counts: 1001=109, 1000=63, 1100=12, 1010=9, 1101=8, 1011=7, 0001=2.' \
            'Current support sizes: mode1=208, mode2=20, mode3=16, mode4=126.' \
            'All unordered individual pairs checked in Lean: 21945.' \
            'Minimal pair conflicts: 168.' \
            'Mechanically derived universal frontier: (30,180), (56,137), (58,90), (76,85), (92,80).' \
            '' \
            'Boundary: Lean verifies the exact 210-world incidence bridge and V0.11 executable OperationalSound decisions. The numeric Pareto frontier was derived mechanically from the raw 840 rows and imported as certified candidate supports; Lean does not parse or independently prove those raw-data numeric calculations.' \
            > MODECHOICE_FULL210_CERTIFICATE.txt
          sha256sum v011_modechoice_full210_bridge.lean generate_v011_modechoice_full210_v2.py INSACERMO_CORE_ENGINE_V011_MODECHOICE_FULL210.lean V011_MODECHOICE_FULL210_OUTPUT.txt MODECHOICE_FULL210_CERTIFICATE.txt > MODECHOICE_FULL210_SHA256SUMS.txt
      - name: Upload full-210 evidence
        uses: actions/upload-artifact@v4
        with:
          name: INSACERMO_V011_MODECHOICE_FULL210_BRIDGE
          path: |
            lean_ci/V011_MODECHOICE_FULL210_OUTPUT.txt
            lean_ci/v011_modechoice_full210_bridge.lean
            lean_ci/generate_v011_modechoice_full210_v2.py
            lean_ci/MODECHOICE_FULL210_CERTIFICATE.txt
            lean_ci/MODECHOICE_FULL210_SHA256SUMS.txt
          if-no-files-found: error
