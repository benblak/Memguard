name: INSACERMO V0.11 capability-information law
on:
  push:
    branches: [insacermo-core-v08-build-test]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Materialize certified V0.11 engine plus capability-information law
        run: |
          set -euo pipefail
          cd lean_ci
          gzip -dc InsacermoFlatV09.lean.gz > full.lean
          awk '/-- ===== Compiler.lean =====/{exit} {print}' full.lean > InsacermoFlat.lean
          python3 apply_mathcore_v010.py
          mv InsacermoFlat.lean mathcore_v010.lean
          cat mathcore_v010.lean > InsacermoV011StageB.lean
          awk 'BEGIN{p=0} /-- ===== Compiler.lean =====/{p=1} /-- ===== ExecutableCompiler.lean =====/{exit} p{print}' full.lean >> InsacermoV011StageB.lean
          cp InsacermoV011StageB.lean InsacermoV011StageA.lean
          python3 apply_v011_stagea.py
          mv InsacermoV011StageA.lean semantic_stagea_verified.lean
          cat semantic_stagea_verified.lean > InsacermoV011StageB.lean
          awk 'BEGIN{p=0} /-- ===== ExecutableCompiler.lean =====/{p=1} /-- ===== OperationalSemantics.lean =====/{exit} p{print}' full.lean >> InsacermoV011StageB.lean
          python3 apply_v011_stageb.py
          cat InsacermoV011StageB.lean > InsacermoV011StageC.lean
          awk 'BEGIN{p=0} /-- ===== OperationalSemantics.lean =====/{p=1} /-- ===== ExecutableSoundness.lean =====/{exit} p{print}' full.lean >> InsacermoV011StageC.lean
          python3 apply_v011_stagec.py
          cat InsacermoV011StageC.lean > InsacermoV011StageD.lean
          awk 'BEGIN{p=0} /-- ===== ExecutableSoundness.lean =====/{p=1} p{print}' full.lean >> InsacermoV011StageD.lean
          python3 apply_v011_staged.py
          python3 apply_v011_staged_terminal_fix.py
          cat InsacermoV011StageD.lean v011_capability_information_law.lean > INSACERMO_V011_CAPABILITY_INFORMATION_LAW.lean
          wc -l INSACERMO_V011_CAPABILITY_INFORMATION_LAW.lean
      - name: Install Lean 4.32.1
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check capability-information law
        working-directory: lean_ci
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          lake env lean INSACERMO_V011_CAPABILITY_INFORMATION_LAW.lean | tee V011_CAPABILITY_INFORMATION_LAW_OUTPUT.txt
      - name: Verify no placeholders
        working-directory: lean_ci
        run: |
          if grep -nE '\b(sorry|admit)\b' INSACERMO_V011_CAPABILITY_INFORMATION_LAW.lean; then exit 1; fi
          echo 'No sorry/admit placeholders found.'
      - name: Build evidence note
        working-directory: lean_ci
        run: |
          printf '%s\n' \
            'INSACERMO V0.11 — CAPABILITY-INFORMATION MONOTONICITY LAW' \
            '' \
            "Run: ${GITHUB_RUN_ID}" \
            "Commit: ${GITHUB_SHA}" \
            'General theorem: capability inclusion implies inclusion of operationally safe representation families.' \
            'Strict finite witness: the same constant/coarse representation is unsafe before capability expansion and safe after expansion.' \
            'Interpretation: capability can buy the right to forget.' \
            'Boundary: formal theorem under the declared definitions; historical novelty is not proved by Lean.' \
            > CAPABILITY_INFORMATION_LAW_CERTIFICATE.txt
          sha256sum v011_capability_information_law.lean INSACERMO_V011_CAPABILITY_INFORMATION_LAW.lean V011_CAPABILITY_INFORMATION_LAW_OUTPUT.txt CAPABILITY_INFORMATION_LAW_CERTIFICATE.txt > CAPABILITY_INFORMATION_LAW_SHA256SUMS.txt
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: INSACERMO_V011_CAPABILITY_INFORMATION_LAW
          path: |
            lean_ci/V011_CAPABILITY_INFORMATION_LAW_OUTPUT.txt
            lean_ci/v011_capability_information_law.lean
            lean_ci/CAPABILITY_INFORMATION_LAW_CERTIFICATE.txt
            lean_ci/CAPABILITY_INFORMATION_LAW_SHA256SUMS.txt
          if-no-files-found: error
