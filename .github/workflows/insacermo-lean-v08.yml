name: INSACERMO V0.11 HIV archive conflict bridge
on:
  push:
    branches: [insacermo-core-v08-build-test]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Materialize certified V0.11 engine plus HIV archive witness bridge
        run: |
          set -euo pipefail
          cd lean_ci
          gzip -dc InsacermoFlatV09.lean.gz > full.lean
          awk '/-- ===== Compiler.lean =====/{exit} {print}' full.lean > InsacermoFlat.lean
          python3 apply_mathcore_v010.py
          mv InsacermoFlat.lean mathcore_v010.lean
          cat mathcore_v010.lean > InsacermoV011StageB.lean
          awk 'BEGIN{p=0} /-- ===== Compiler.lean =====/{p=1} /-- ===== ExecutableCompiler.lean =====/{exit} p{print}' full.lean >> InsacermoV011StageB.lean
          cp InsacermoV011StageB.lean InsacermoV011StageA.lean
          python3 apply_v011_stagea.py
          mv InsacermoV011StageA.lean semantic_stagea_verified.lean
          cat semantic_stagea_verified.lean > InsacermoV011StageB.lean
          awk 'BEGIN{p=0} /-- ===== ExecutableCompiler.lean =====/{p=1} /-- ===== OperationalSemantics.lean =====/{exit} p{print}' full.lean >> InsacermoV011StageB.lean
          python3 apply_v011_stageb.py
          cat InsacermoV011StageB.lean > InsacermoV011StageC.lean
          awk 'BEGIN{p=0} /-- ===== OperationalSemantics.lean =====/{p=1} /-- ===== ExecutableSoundness.lean =====/{exit} p{print}' full.lean >> InsacermoV011StageC.lean
          python3 apply_v011_stagec.py
          cat InsacermoV011StageC.lean > InsacermoV011StageD.lean
          awk 'BEGIN{p=0} /-- ===== ExecutableSoundness.lean =====/{p=1} p{print}' full.lean >> InsacermoV011StageD.lean
          python3 apply_v011_staged.py
          python3 apply_v011_staged_terminal_fix.py
          cp InsacermoV011StageD.lean INSACERMO_CORE_ENGINE_V011.lean
          python3 generate_v011_hiv_structure_conflict.py
          cat INSACERMO_CORE_ENGINE_V011.lean v011_hiv_structure_conflict_bridge.lean > INSACERMO_CORE_ENGINE_V011_HIV_STRUCTURE_CONFLICT.lean
          wc -l INSACERMO_CORE_ENGINE_V011_HIV_STRUCTURE_CONFLICT.lean
      - name: Install Lean 4.32.1
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Execute and kernel-check HIV REFUSE witness bridge
        working-directory: lean_ci
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          lake env lean INSACERMO_CORE_ENGINE_V011_HIV_STRUCTURE_CONFLICT.lean | tee V011_HIV_STRUCTURE_CONFLICT_OUTPUT.txt
      - name: Verify HIV suite has no placeholders
        working-directory: lean_ci
        run: |
          if grep -nE '\b(sorry|admit)\b' INSACERMO_CORE_ENGINE_V011_HIV_STRUCTURE_CONFLICT.lean; then exit 1; fi
          echo 'No sorry/admit placeholders found.'
      - name: Build HIV evidence note
        working-directory: lean_ci
        run: |
          printf '%s\n' \
            'INSACERMO V0.11 — HIV ARCHIVE STRUCTURE-CONFLICT REFUSE BRIDGE' \
            '' \
            "Run: ${GITHUB_RUN_ID}" \
            "Commit: ${GITHUB_SHA}" \
            'Source audit: archived HIV.txt, mechanical exhaustive audit outside Lean.' \
            'Archived raw SHA256: d0e985c9c1191c77958ac52a278338c241858394fd3b299f56113329e1fc935c.' \
            'Rows: 41913; exact-SMILES conflict groups: 28; rows involved: 76; opposite-label pairs: 54.' \
            'Formal input: deterministic two-row witness extracted from that archived audit.' \
            'Expected V0.11 decision: REFUSE under the listed structure-only probe.' \
            '' \
            'Boundary: Lean proves the induced witness contract, not the 41913-row CSV audit. No biological impossibility or clinical claim; searchComplete is relative to the listed probe set.' \
            > HIV_STRUCTURE_CONFLICT_CERTIFICATE.txt
          sha256sum generate_v011_hiv_structure_conflict.py v011_hiv_structure_conflict_bridge.lean INSACERMO_CORE_ENGINE_V011_HIV_STRUCTURE_CONFLICT.lean V011_HIV_STRUCTURE_CONFLICT_OUTPUT.txt HIV_STRUCTURE_CONFLICT_RECEIPT.txt HIV_STRUCTURE_CONFLICT_CERTIFICATE.txt > HIV_STRUCTURE_CONFLICT_SHA256SUMS.txt
      - name: Upload HIV evidence
        uses: actions/upload-artifact@v4
        with:
          name: INSACERMO_V011_HIV_ARCHIVE_STRUCTURE_CONFLICT_BRIDGE
          path: |
            lean_ci/V011_HIV_STRUCTURE_CONFLICT_OUTPUT.txt
            lean_ci/v011_hiv_structure_conflict_bridge.lean
            lean_ci/generate_v011_hiv_structure_conflict.py
            lean_ci/HIV_STRUCTURE_CONFLICT_RECEIPT.txt
            lean_ci/HIV_STRUCTURE_CONFLICT_CERTIFICATE.txt
            lean_ci/HIV_STRUCTURE_CONFLICT_SHA256SUMS.txt
          if-no-files-found: error
