name: INSACERMO Belief Policy Sufficient Future State Kernel V1

on:
  push:
    branches:
      - insacermo-belief-policy-sufficient-future-state-kernel-v1

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Lean 4.32.1
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --retry-delay 5 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          for attempt in 1 2 3 4; do
            if elan toolchain install leanprover/lean4:v4.32.1; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Lean 4.32.1 installation failed after 4 attempts" >&2
              exit 1
            fi
            rm -rf "$HOME/.elan/tmp"/* || true
            sleep $((attempt * 10))
          done

      - name: Prepare mathlib
        working-directory: lean_ci
        run: |
          set -euo pipefail
          lake update
          lake exe cache get
          mkdir -p .lake/build/lib/lean

      - name: Materialize certified Bayes kernel dependency
        working-directory: lean_ci
        run: |
          set -euo pipefail
          python3 patch_bayes_adaptive_kernel_v1.py
          cp bayes_adaptive_kernel_v1.lean BayesAdaptiveKernelV1.lean
          sha256sum BayesAdaptiveKernelV1.lean

      - name: Build historical dependencies
        working-directory: lean_ci
        run: |
          set -euo pipefail
          lake env lean -o .lake/build/lib/lean/MinimalSufficientFutureStateKernelV1.olean MinimalSufficientFutureStateKernelV1.lean
          lake env lean -o .lake/build/lib/lean/BayesAdaptiveKernelV1.olean BayesAdaptiveKernelV1.lean

      - name: Kernel-check belief policy sufficient future state kernel
        id: kernel
        continue-on-error: true
        working-directory: lean_ci
        run: |
          set -o pipefail
          lake env lean -o .lake/build/lib/lean/BeliefPolicySufficientFutureStateKernelV1.olean BeliefPolicySufficientFutureStateKernelV1.lean 2>&1 | tee BELIEF_POLICY_SUFFICIENT_FUTURE_STATE_KERNEL_V1_OUTPUT.txt

      - name: Persist diagnostics if Lean fails
        if: steps.kernel.outcome == 'failure'
        run: |
          set -euo pipefail
          cp lean_ci/BELIEF_POLICY_SUFFICIENT_FUTURE_STATE_KERNEL_V1_OUTPUT.txt lean_ci/BELIEF_POLICY_SUFFICIENT_FUTURE_STATE_KERNEL_V1_DIAGNOSTIC.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lean_ci/BELIEF_POLICY_SUFFICIENT_FUTURE_STATE_KERNEL_V1_DIAGNOSTIC.txt
          git commit -m 'Capture belief-policy future-state diagnostics [skip ci]' || true
          git push
          exit 1

      - name: Bundled leanchecker independent replay
        if: steps.kernel.outcome == 'success'
        working-directory: lean_ci
        run: |
          set -euo pipefail
          lake env leanchecker -v BeliefPolicySufficientFutureStateKernelV1 | tee BELIEF_POLICY_SUFFICIENT_FUTURE_STATE_KERNEL_V1_LEANCHECKER.txt

      - name: Verify no placeholders or custom axioms
        if: steps.kernel.outcome == 'success'
        working-directory: lean_ci
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('BeliefPolicySufficientFutureStateKernelV1.lean')
          s = p.read_text()
          out=[]; i=0; depth=0
          while i < len(s):
              if s.startswith('/-', i): depth += 1; i += 2; continue
              if depth and s.startswith('-/', i): depth -= 1; i += 2; continue
              if depth:
                  out.append('\n' if s[i]=='\n' else ' '); i += 1; continue
              if s.startswith('--', i):
                  j=s.find('\n', i)
                  if j<0: break
                  out.append('\n'); i=j+1; continue
              out.append(s[i]); i += 1
          code=''.join(out)
          bad=[]
          for n,line in enumerate(code.splitlines(),1):
              if re.search(r'\b(?:sorry|admit)\b', line): bad.append((n,line))
              if re.search(r'^\s*axiom\b', line): bad.append((n,line))
          if bad:
              for n,line in bad: print(f'{n}:{line}')
              raise SystemExit(1)
          print('No sorry/admit/custom axiom placeholders found in executable Lean code.')
          PY

      - name: Build certification receipt
        if: steps.kernel.outcome == 'success'
        working-directory: lean_ci
        run: |
          set -euo pipefail
          printf '%s\n' \
            'INSACERMO BELIEF POLICY SUFFICIENT FUTURE STATE KERNEL V1 — CERTIFICATION' \
            '' \
            "Run: ${GITHUB_RUN_ID}" \
            "Commit: ${GITHUB_SHA}" \
            'Lean: 4.32.1' \
            'mathlib: v4.32.1' \
            'Bayes dependency materialization: historical certified patch path' \
            'Kernel check: success' \
            'Leanchecker independent replay: success' \
            'Placeholders/custom axioms: none' \
            > BELIEF_POLICY_SUFFICIENT_FUTURE_STATE_KERNEL_V1_CERTIFICATE.txt
          cp .lake/build/lib/lean/BeliefPolicySufficientFutureStateKernelV1.olean ./BeliefPolicySufficientFutureStateKernelV1.olean
          sha256sum BeliefPolicySufficientFutureStateKernelV1.lean BeliefPolicySufficientFutureStateKernelV1.olean BELIEF_POLICY_SUFFICIENT_FUTURE_STATE_KERNEL_V1_OUTPUT.txt BELIEF_POLICY_SUFFICIENT_FUTURE_STATE_KERNEL_V1_LEANCHECKER.txt BELIEF_POLICY_SUFFICIENT_FUTURE_STATE_KERNEL_V1_CERTIFICATE.txt > BELIEF_POLICY_SUFFICIENT_FUTURE_STATE_KERNEL_V1_SHA256SUMS.txt

      - name: Upload evidence
        if: steps.kernel.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: INSACERMO_BELIEF_POLICY_SUFFICIENT_FUTURE_STATE_KERNEL_V1
          path: |
            lean_ci/BeliefPolicySufficientFutureStateKernelV1.lean
            lean_ci/BeliefPolicySufficientFutureStateKernelV1.olean
            lean_ci/BELIEF_POLICY_SUFFICIENT_FUTURE_STATE_KERNEL_V1_OUTPUT.txt
            lean_ci/BELIEF_POLICY_SUFFICIENT_FUTURE_STATE_KERNEL_V1_LEANCHECKER.txt
            lean_ci/BELIEF_POLICY_SUFFICIENT_FUTURE_STATE_KERNEL_V1_CERTIFICATE.txt
            lean_ci/BELIEF_POLICY_SUFFICIENT_FUTURE_STATE_KERNEL_V1_SHA256SUMS.txt
          if-no-files-found: error
